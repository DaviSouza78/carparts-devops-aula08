name: CI Carparts
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  componentes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        componente: [apps/portal, apps/api, libs/ui, prompts]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            ${{ matrix.componente }}
            libs/ui
            scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache de downloads npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ matrix.componente }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-${{ matrix.componente }}-
      - name: Validar componente e biblioteca dependente
        run: node scripts/validar.cjs "${{ matrix.componente }}"
  integracao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            apps
            libs
            prompts
            scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar composição do monorepo
        run: node scripts/validar.cjs all
  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar gitleaks de versão fixada pelo registro Go
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.2
      - name: Verificar segredos no histórico
        run: "$(go env GOPATH)/bin/gitleaks git --redact --exit-code 1 ."
  gate:
    name: ci-obrigatorio
    if: always()
    needs: [componentes, integracao, segredos]
    runs-on: ubuntu-latest
    steps:
      - name: Rejeitar falhas, cancelamentos ou jobs omitidos
        env:
          COMPONENTES: ${{ needs.componentes.result }}
          INTEGRACAO: ${{ needs.integracao.result }}
          SEGREDOS: ${{ needs.segredos.result }}
        run: test "$COMPONENTES" = success && test "$INTEGRACAO" = success && test "$SEGREDOS" = success
