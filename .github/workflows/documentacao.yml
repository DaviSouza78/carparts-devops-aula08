name: Documentacao opcional por caminhos
on:
  pull_request:
    paths:
      - '**.md'
      - 'prompts/**'
permissions:
  contents: read
jobs:
  documentos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            prompts
      - run: echo 'Documentação disponível para revisão humana; check opcional.'
